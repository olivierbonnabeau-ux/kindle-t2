# Configuration de l'écran "quand partir" — Pont de Bezons, tram T2

stop:
  name: "Pont de Bezons"
  # Identifiants trouvés via l'open data IDFM (dataset arrets-lignes).
  # Le terminus a deux quais ; on interroge les deux et on fusionne.
  stop_point_ids: ["23445"]                 # → MonitoringRef=STIF:StopPoint:Q:<id>: (quai principal)
  secondary_stop_point_ids: ["25647"]       # second quai, jamais vu actif : interrogé rarement
  line_id: "C01390"                          # T2 → LineRef=STIF:Line::C01390:
  line_name: "T2"
  destination: "Porte de Versailles"

people:
  - name: "Cam"
    key: "cam"            # sous-dossier dans ./pictos/
    walk_min: 9
    margin_min: 1
  - name: "Oliv"
    key: "oliv"
    walk_min: 6
    margin_min: 1

timezone: "Europe/Paris"

# Plages horaires (heures locales). Le serveur ne régénère jamais l'image plus
# souvent que min_regen_s, quelle que soit la fréquence des requêtes.
schedule:
  min_regen_s: 20     # le Kindle redemande l'image toutes les ~20 s
  active:   { start: "05:30", end: "10:00", refresh_s: 60 }    # heures de pointe (premier T2 vers 5h30)
  normal:   { refresh_s: 300 }                                  # le reste de la journée
  # Écran nuit (pas d'appel API) : après le dernier T2 (~0h30 en semaine, ~1h30 les nuits
  # de vendredi et samedi → start_weekend s'applique aux nuits qui précèdent samedi et dimanche).
  night:    { start: "00:50", start_weekend: "01:50", end: "05:30", refresh_s: 1800 }

prim:
  # QUOTAS PRIM : 1 000 appels / jour / API (temps réel, info trafic, Navitia), remise à zéro vers 1h.
  # Budget visé ≈ 700 / 150 / 50 par jour.
  timeout_s: 10
  max_departures: 8
  # Temps réel (stop-monitoring) : un appel par quai principal, cadence selon l'heure.
  cache_s: 150                 # hors pointe : un appel toutes les 2,5 min  (~360 / jour)
  cache_peak_s: 60             # heures de pointe (schedule.active) : toutes les 60 s (~270 / jour)
  secondary_interval_s: 900    # second quai : toutes les 15 min (~80 / jour)
  # Info trafic (general-message)
  traffic_cache_s: 600         # toutes les 10 min (~150 / jour)
  # Horaires théoriques (Navitia) : complètent les 2 passages temps réel, et servent de repli
  # quand le temps réel est indisponible (quota épuisé, panne).
  navitia_stop_points: ["stop_point:IDFM:23445"]
  navitia_count: 12
  navitia_cache_s: 1800        # toutes les 30 min (~50 / jour)

server:
  host: "0.0.0.0"
  port: 8080

render:
  width: 758
  height: 1024
  next_departures: 4
